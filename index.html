<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--surface3:#3a3a3c;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#f5f5f7;--text2:rgba(245,245,247,.7);--text3:rgba(245,245,247,.5);--text4:rgba(245,245,247,.28);
  --accent:#f97316;
  --green:#30d158;--blue:#0a84ff;--purple:#bf5af2;--red:#ff453a;--yellow:#ffd60a;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --mono:'SF Mono','JetBrains Mono',ui-monospace,monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.47;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* SCROLL ANIM */
[data-anim]{opacity:0;transform:translateY(30px);transition:opacity 1.2s cubic-bezier(.16,1,.3,1),transform 1.2s cubic-bezier(.16,1,.3,1)}
[data-anim].visible{opacity:1;transform:none}
[data-anim-delay="1"]{transition-delay:.08s}[data-anim-delay="2"]{transition-delay:.16s}
[data-anim-delay="3"]{transition-delay:.24s}[data-anim-delay="4"]{transition-delay:.32s}
[data-anim-delay="5"]{transition-delay:.4s}[data-anim-delay="6"]{transition-delay:.48s}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:999;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-right));background:rgba(0,0,0,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.nav-logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(249,115,22,.4)}
.nav-logo b{color:var(--accent)}
.nav-logo span{font-size:14px;font-weight:600;letter-spacing:-.02em}
.nav-tabs{display:flex;gap:1px;background:var(--surface);border-radius:8px;padding:2px}
.nav-tab{padding:5px 14px;border-radius:6px;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;transition:color .3s,background .3s}
.nav-tab:hover{color:var(--text2)}
.nav-tab.on{color:var(--text);background:var(--surface2)}
.nav-meta{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text4);font-family:var(--mono)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* HERO */
.hero{text-align:center;padding:120px 24px 0;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:900px;height:700px;background:radial-gradient(ellipse at 50% 20%,rgba(249,115,22,.1) 0%,rgba(191,90,242,.04) 35%,transparent 60%);pointer-events:none}
.hero-eyebrow{font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin-bottom:20px}
.hero-title{font-size:clamp(52px,9vw,80px);font-weight:800;letter-spacing:-.05em;line-height:1.02}
.hero-title em{font-style:normal;background:linear-gradient(90deg,#f97316,#ffd60a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(19px,2.5vw,24px);color:var(--text2);margin-top:14px;font-weight:300;letter-spacing:-.01em;max-width:520px;margin-left:auto;margin-right:auto}

/* FEATURED */
.featured{max-width:1120px;margin:0 auto;padding:72px 24px 0}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat-tile{position:relative;border-radius:20px;overflow:hidden;text-decoration:none;color:var(--text);display:block;background:var(--surface);border:1px solid var(--border);transition:transform .6s cubic-bezier(.16,1,.3,1),box-shadow .6s}
.feat-tile:hover{transform:scale(1.01);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.feat-tile-main{grid-column:1/-1;padding:56px 48px 80px;min-height:420px}
.feat-tile-sm{padding:40px 36px;display:flex;align-items:center;gap:20px;min-height:140px}
.feat-tile-sm:hover{border-color:var(--border2)}
.feat-glow{position:absolute;top:-100px;right:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.08) 0%,transparent 65%);pointer-events:none}
.feat-rank{position:absolute;top:20px;left:32px;font-family:var(--mono);font-size:96px;font-weight:900;color:rgba(255,255,255,.02);line-height:1}
.feat-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;border-radius:20px;background:rgba(249,115,22,.12);color:var(--accent);margin-bottom:16px;backdrop-filter:blur(8px)}
.feat-name{font-size:clamp(24px,3.5vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
.feat-desc{font-size:17px;color:var(--text2);line-height:1.45;max-width:480px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat-links{display:flex;gap:20px;margin-top:20px}
.feat-link{font-size:14px;font-weight:500;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px;transition:opacity .2s}
.feat-link:hover{opacity:.7}
.feat-link::after{content:'›';font-size:16px}
.feat-stats{display:flex;gap:24px;margin-top:24px;font-size:13px;color:var(--text3)}
.feat-stats b{font-weight:600;color:var(--text2)}
.feat-sm-rank{font-family:var(--mono);font-size:32px;font-weight:800;color:rgba(255,255,255,.04);flex-shrink:0}
.feat-sm-body{flex:1;min-width:0}
.feat-sm-name{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-sm-desc{font-size:13px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-sm-stars{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--yellow);flex-shrink:0}

/* METRICS */
.metrics{max-width:1120px;margin:0 auto;padding:80px 24px 0}
.metrics-label{text-align:center;font-size:13px;font-weight:500;color:var(--text4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:40px}
.metrics-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.metric{text-align:center;padding:32px 20px;background:var(--surface);border:1px solid var(--border);border-radius:18px;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .3s}
.metric:hover{transform:translateY(-4px);border-color:var(--border2)}
.metric::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:3px;border-radius:0 0 3px 3px}
.metric:nth-child(1)::before{background:var(--accent)}.metric:nth-child(2)::before{background:var(--yellow)}
.metric:nth-child(3)::before{background:var(--green)}.metric:nth-child(4)::before{background:var(--purple)}
.metric:nth-child(5)::before{background:var(--blue)}
.metric-l{font-size:11px;color:var(--text4);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.metric-v{font-size:clamp(26px,3.5vw,34px);font-weight:800;letter-spacing:-.03em;margin-top:6px}
.metric-s{font-size:10px;color:var(--text4);margin-top:4px}

/* CHARTS */
.charts-section{max-width:1120px;margin:0 auto;padding:40px 24px 0}
.charts-title{text-align:center;font-size:13px;font-weight:500;color:var(--text4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:40px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .3s}
.chart-card:hover{transform:translateY(-3px);border-color:var(--border2)}
.chart-card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.chart-card-dot{width:8px;height:8px;border-radius:50%}
.chart-card-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.chart-card canvas{width:100%;height:auto;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px}
.chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.chart-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* REPO LIST */
.repos{max-width:1120px;margin:0 auto;padding:80px 24px 0}
.repos-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.repos-dot{width:8px;height:8px;border-radius:50%}
.repos-h{font-size:13px;font-weight:600;color:var(--text2)}
.repos-cnt{font-size:11px;color:var(--text4);margin-left:auto;font-family:var(--mono)}
.repos-line{height:1px;background:linear-gradient(90deg,var(--border2),transparent);margin-bottom:20px}
.list-col{display:grid;grid-template-columns:32px 28px 2.5fr 1fr 60px 60px 68px;gap:8px;padding:0 16px 10px;font-size:10px;color:var(--text4);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;grid-template-columns:32px 28px 2.5fr 1fr 60px 60px 68px;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;text-decoration:none;color:inherit;border:1px solid transparent;transition:all .3s cubic-bezier(.16,1,.3,1)}
.row:hover{background:var(--surface);border-color:var(--border);transform:translateX(4px)}
.row:hover .row-name{color:var(--accent)}
.row-n{font-family:var(--mono);font-size:11px;color:var(--text4);text-align:center}
.row-av{width:24px;height:24px;border-radius:6px;background:var(--surface2);overflow:hidden}
.row-av img{width:100%;height:100%;object-fit:cover}
.row-name{font-size:13px;font-weight:600;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-desc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-lang{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.row-star{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--yellow);text-align:right}
.row-fork{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:right}
.row-tag{display:flex;justify-content:flex-end}
.badge{font-size:8px;padding:3px 7px;border-radius:8px;font-weight:700;letter-spacing:.03em}
.badge-hot{background:rgba(255,69,58,.1);color:var(--red)}
.badge-up{background:rgba(10,132,255,.1);color:var(--blue)}
.badge-new{background:rgba(48,209,88,.1);color:var(--green)}

/* LANG */
.l-Python{background:#3572A5}.l-TypeScript{background:#3178c6}.l-JavaScript{background:#f1e05a}
.l-Rust{background:#dea584}.l-Go{background:#00ADD8}.l-Swift{background:#F05138}
.l-Kotlin{background:#A97BFF}.l-C{background:#8e8e93}.l-HTML{background:#e34c26}
.l-Vue{background:#41b883}.l-Java{background:#b07219}.l-Shell{background:#89e051}
.l-Dart{background:#00B4AB}.l-Ruby{background:#701516}.l-default{background:var(--text4)}

.foot{max-width:1120px;margin:100px auto 0;padding:20px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:11px;color:var(--text4)}

@media(max-width:1068px){
  .feat-tile-main{padding:40px 36px 60px;min-height:320px}
  .charts-grid{grid-template-columns:1fr 1fr}
  .charts-grid .chart-card:last-child{grid-column:1/-1}
  .metrics-grid{grid-template-columns:repeat(3,1fr)}
  .row{grid-template-columns:28px 24px 2fr 56px 56px}
  .row .row-lang,.row .row-tag{display:none}
  .list-col{display:none}
}
@media(max-width:734px){
  .nav{padding:0 16px}
  .charts-grid{grid-template-columns:1fr}
  .charts-grid .chart-card:last-child{grid-column:auto}
  .hero{padding-top:100px}
  .hero-title{font-size:40px;letter-spacing:-.04em}
  .hero-sub{font-size:17px}
  .featured,.metrics,.repos{padding-left:16px;padding-right:16px}
  .feat-grid{grid-template-columns:1fr}
  .feat-tile-main{padding:32px 24px 48px;min-height:240px}
  .feat-rank{font-size:60px}
  .feat-name{font-size:22px}
  .metrics-grid{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:24px 2fr 48px;padding:10px 12px}
  .row .row-av,.row-fork,.row-lang,.row-tag{display:none}
  .nav-tabs{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="#"><div class="nav-logo-dot"></div><span>Git<b>Pulse</b></span></a>
  <div class="nav-tabs" id="tabs">
    <button class="nav-tab on" data-t="daily">今日</button>
    <button class="nav-tab" data-t="weekly">本周</button>
    <button class="nav-tab" data-t="monthly">本月</button>
  </div>
  <div class="nav-meta"><div class="pulse"></div><span id="clock">—</span></div>
</nav>

<div class="hero">
  <p class="hero-eyebrow" data-anim>Open Source Intelligence</p>
  <h1 class="hero-title" data-anim data-anim-delay="1"><em>开源脉搏，</em><br>实时跳动。</h1>
  <p class="hero-sub" data-anim data-anim-delay="2">追踪全球最热门的 GitHub 项目，数据驱动洞察开源趋势。</p>
</div>

<div class="featured" id="featured"></div>

<div class="metrics">
  <p class="metrics-label" data-anim>关键指标</p>
  <div id="metricsGrid"></div>
</div>

<div class="charts-section" id="chartsSection">
  <p class="charts-title" data-anim>数据洞察</p>
  <div class="charts-grid">
    <div class="chart-card" data-anim>
      <div class="chart-card-head"><span class="chart-card-dot" style="background:var(--purple)"></span><span class="chart-card-label">语言分布</span></div>
      <canvas id="langChart" width="360" height="240"></canvas>
      <div id="langLegend" class="chart-legend"></div>
    </div>
    <div class="chart-card" data-anim data-anim-delay="1">
      <div class="chart-card-head"><span class="chart-card-dot" style="background:var(--yellow)"></span><span class="chart-card-label">Stars Top 10</span></div>
      <canvas id="starsChart" width="360" height="240"></canvas>
    </div>
    <div class="chart-card" data-anim data-anim-delay="2">
      <div class="chart-card-head"><span class="chart-card-dot" style="background:var(--blue)"></span><span class="chart-card-label">周期对比</span></div>
      <canvas id="periodChart" width="360" height="240"></canvas>
    </div>
  </div>
</div>

<div id="repoSection"></div>

<footer class="foot">
  <span>GitPulse · GitHub API · 每日更新</span>
  <span>Built with ♥</span>
</footer>

<script>
const LC={Python:'#3572A5',TypeScript:'#3178c6',JavaScript:'#f1e05a',Rust:'#dea584',Go:'#00ADD8',Swift:'#F05138',Kotlin:'#A97BFF',HTML:'#e34c26',Vue:'#41b883',Java:'#b07219',Shell:'#89e051',Dart:'#00B4AB',Ruby:'#701516',CSS:'#563d7c',C:'#8e8e93','C++':'#f34b7d','C#':'#178600',Zig:'#ec915c'};
const F=n=>{if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return n};
const B=(c,t)=>`<span class="badge ${c}">${t}</span>`;

/* SCROLL OBSERVER */
function initAnim(){
  const o=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}});
  },{threshold:.05,rootMargin:'0px 0px -20px 0px'});
  document.querySelectorAll('[data-anim]:not(.visible)').forEach(el=>o.observe(el));
}

/* COUNTER */
function animNums(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const t=+el.dataset.n,dur=1.4e3,s=performance.now(),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
    !function f(now){
      const p=Math.min((now-s)/dur,1),e=1-Math.pow(1-p,4);
      el.textContent=pre+(Number.isInteger(t)?Math.round(t*e):(t*e).toFixed(1))+suf;
      if(p<1)requestAnimationFrame(f);
    }(s);
  });
}

/* CHARTS */
function drawDonut(canvasId,legendId,data){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height,cx=W/2,cy=H/2;
  const R=Math.min(W,H)/2-16,r=R*.58;
  const total=data.reduce((s,d)=>s+d.v,0);
  const colors=['#f97316','#3178c6','#3572A5','#dea584','#00ADD8','#F05138','#A97BFF','#e34c26','#41b883','#b07219','#89e051','#bf5af2'];
  const lg=document.getElementById(legendId);
  if(lg)lg.innerHTML=data.slice(0,8).map((d,i)=>`<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${colors[i%colors.length]}"></span>${d.k} (${d.v})</div>`).join('');
  const anim=1.2e3,start=performance.now();
  !function frame(now){
    const p=Math.min((now-start)/anim,1),ease=1-Math.pow(1-p,3);
    ctx.clearRect(0,0,W,H);let a=-Math.PI/2;
    data.forEach((d,i)=>{
      const slice=d.v/total*Math.PI*2*ease;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      ctx.arc(cx,cy,R,a,a+slice);ctx.arc(cx,cy,r,a+slice,a,true);ctx.closePath();
      ctx.fillStyle=colors[i%colors.length];ctx.fill();a+=slice;
    });
    ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.fillStyle='#1c1c1e';ctx.fill();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(245,245,247,.5)';ctx.font='500 11px Inter';ctx.fillText('项目数',cx,cy-10);
    ctx.fillStyle='#f5f5f7';ctx.font='800 22px Inter';ctx.fillText(total,cx,cy+12);
    if(p<1)requestAnimationFrame(frame);
  }(start);
}

function drawBars(canvasId,data){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height,pad={t:8,r:12,b:28,l:48};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const maxV=Math.max(...data.map(d=>d.v))*1.15||1;
  const colors=['#ffd60a','#f97316','#ff9500','#ff6723','#30d158','#32d74b','#0a84ff','#64d2ff','#bf5af2','#da8fff'];
  const anim=1.2e3,start=performance.now();
  !function frame(now){
    const p=Math.min((now-start)/anim,1),ease=1-Math.pow(1-p,3);
    ctx.clearRect(0,0,W,H);
    const barH=Math.max(1,(cH/data.length)*.65);
    const gap=(cH-data.length*barH)/(data.length+1);
    data.forEach((d,i)=>{
      const y=pad.t+gap+(barH+gap)*i;
      const w=d.v/maxV*cW*ease;
      const grad=ctx.createLinearGradient(pad.l,0,pad.l+w,0);
      grad.addColorStop(0,colors[i%colors.length]);grad.addColorStop(1,colors[i%colors.length]+'66');
      ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(pad.l,y,w,barH,4);ctx.fill();
      ctx.fillStyle='rgba(245,245,247,.5)';ctx.font='500 10px Inter';ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.fillText(d.k.length>14?d.k.slice(0,14)+'…':d.k,pad.l-8,y+barH/2);
      ctx.fillStyle='rgba(245,245,247,.7)';ctx.font='600 10px SF Mono,JetBrains Mono,monospace';ctx.textAlign='left';
      ctx.fillText(F(d.v),pad.l+w+6,y+barH/2);
    });
    if(p<1)requestAnimationFrame(frame);
  }(start);
}

function drawPeriod(canvasId,daily,weekly,monthly){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height,pad={t:16,r:16,b:32,l:52};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const data=[{label:'今日',v:daily,c:'#ff453a'},{label:'本周',v:weekly,c:'#f97316'},{label:'本月',v:monthly,c:'#0a84ff'}];
  const maxV=Math.max(...data.map(d=>d.v))*1.2||1;
  const anim=1.2e3,start=performance.now();
  !function frame(now){
    const p=Math.min((now-start)/anim,1),ease=1-Math.pow(1-p,3);
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<=4;i++){
      const y=pad.t+cH-cH/4*i;
      ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
      ctx.fillStyle='rgba(245,245,247,.3)';ctx.font='500 9px SF Mono,monospace';ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.fillText(F(Math.round(maxV/4*i)),pad.l-8,y);
    }
    const barW=cW/data.length*.5,gap=(cW-data.length*barW)/(data.length+1);
    data.forEach((d,i)=>{
      const x=pad.l+gap+(barW+gap)*i;
      const h=d.v/maxV*cH*ease,y=pad.t+cH-h;
      const grad=ctx.createLinearGradient(0,y,0,pad.t+cH);
      grad.addColorStop(0,d.c);grad.addColorStop(1,d.c+'33');
      ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x,y,barW,h,6);ctx.fill();
      ctx.fillStyle=d.c;ctx.font='700 12px SF Mono,monospace';ctx.textAlign='center';
      ctx.fillText(F(d.v),x+barW/2,y-8);
      ctx.fillStyle='rgba(245,245,247,.5)';ctx.font='500 11px Inter';
      ctx.fillText(d.label,x+barW/2,pad.t+cH+16);
    });
    if(p<1)requestAnimationFrame(frame);
  }(start);
}

function renderCharts(repos,all){
  const langs={};
  all.forEach(r=>{if(r.language&&r.language!=='—')langs[r.language]=(langs[r.language]||0)+1});
  drawDonut('langChart','langLegend',Object.entries(langs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v})));
  drawBars('starsChart',[...repos].sort((a,b)=>b.stars-a.stars).slice(0,10).map(r=>({k:r.name.split('/').pop()||r.name,v:r.stars})));
  const dS=DATA.daily?DATA.daily.reduce((s,r)=>s+r.stars,0):0;
  const wS=DATA.weekly?DATA.weekly.reduce((s,r)=>s+r.stars,0):0;
  const mS=DATA.monthly?DATA.monthly.reduce((s,r)=>s+r.stars,0):0;
  drawPeriod('periodChart',dS,wS,mS);
}

/* RENDER */
function renderFeatured(repos){
  const top=repos.slice(0,5);
  if(!top.length){document.getElementById('featured').innerHTML='';return;}
  const m=top[0];
  const bg=m.stars>500?B('badge-hot','🔥 HOT'):m.stars>100?B('badge-up','📈 TRENDING'):B('badge-new','✨ NEW');
  document.getElementById('featured').innerHTML=`
  <div class="feat-grid">
    <a class="feat-tile feat-tile-main" href="${m.url}" target="_blank" data-anim>
      <div class="feat-rank">#1</div><div class="feat-glow"></div>
      <div class="feat-badge">${bg} ${F(m.stars)} ⭐</div>
      <div class="feat-name">${m.name}</div>
      <div class="feat-desc">${m.description||'暂无描述'}</div>
      <div class="feat-links"><span class="feat-link">了解更多</span><span class="feat-link">查看源码</span></div>
      <div class="feat-stats"><span>${m.language}</span><span><b>${F(m.stars)}</b> stars</span><span><b>${F(m.forks)}</b> forks</span></div>
    </a>
    ${top.slice(1).map((r,i)=>`
    <a class="feat-tile feat-tile-sm" href="${r.url}" target="_blank" data-anim data-anim-delay="${i+1}">
      <div class="feat-sm-rank">#${i+2}</div>
      <div class="feat-sm-body"><div class="feat-sm-name">${r.name}</div><div class="feat-sm-desc">${r.description||'—'}</div></div>
      <div class="feat-sm-stars">${F(r.stars)}★</div>
    </a>`).join('')}
  </div>`;
}

function renderMetrics(repos,all){
  const langs={};
  all.forEach(r=>{if(r.language&&r.language!=='—')langs[r.language]=(langs[r.language]||0)+1});
  const topL=Object.entries(langs).sort((a,b)=>b[1]-a[1]);
  const mx=repos.length?Math.max(...repos.map(r=>r.stars)):0;
  const avg=repos.length?Math.round(repos.reduce((s,r)=>s+r.stars,0)/repos.length):0;
  document.getElementById('metricsGrid').innerHTML=`
  <div class="metrics-grid">
    <div class="metric" data-anim><div class="metric-l">项目数</div><div class="metric-v" style="color:var(--accent)" data-n="${repos.length}">0</div><div class="metric-s">当前周期</div></div>
    <div class="metric" data-anim data-anim-delay="1"><div class="metric-l">最高星标</div><div class="metric-v" style="color:var(--yellow)" data-n="${mx}">0</div><div class="metric-s">⭐ peak</div></div>
    <div class="metric" data-anim data-anim-delay="2"><div class="metric-l">平均星标</div><div class="metric-v" style="color:var(--green)" data-n="${avg}">0</div><div class="metric-s">Ø stars</div></div>
    <div class="metric" data-anim data-anim-delay="3"><div class="metric-l">热门语言</div><div class="metric-v" style="color:${LC[topL[0]?.[0]]||'var(--purple)'}">${topL[0]?.[0]||'—'}</div><div class="metric-s">${topL[0]?.[1]||0} 项目</div></div>
    <div class="metric" data-anim data-anim-delay="4"><div class="metric-l">语言分布</div><div class="metric-v" style="color:var(--blue)" data-n="${topL.length}">0</div><div class="metric-s">种语言</div></div>
  </div>`;
}

function renderRepos(title,repos,color){
  if(!repos.length)return'';
  const len=Math.max(0,repos.length-5);
  const rows=repos.slice(5).map((r,i)=>{
    const lc=LC[r.language]?`l-${r.language}`:'l-default';
    const t=i<2&&len>2?B('badge-hot','HOT'):i<5&&len>5?B('badge-up','UP'):'';
    return`<a class="row" href="${r.url}" target="_blank" data-anim>
      <div class="row-n">${i+6}</div>
      <div class="row-av">${r.avatar?`<img src="${r.avatar}&s=64" loading="lazy" onerror="this.style.display='none'">`:''}</div>
      <div class="row-name">${r.name}</div>
      <div class="row-desc">${r.description||'—'}</div>
      <div class="row-lang"><span class="dot ${lc}"></span>${r.language}</div>
      <div class="row-star">${F(r.stars)}</div>
      <div class="row-fork">${F(r.forks)}</div>
      <div class="row-tag">${t}</div>
    </a>`;
  }).join('');
  return`<div class="repos">
    <div class="repos-head" data-anim><div class="repos-dot" style="background:${color}"></div><div class="repos-h">${title}</div><div class="repos-cnt">${len} more</div></div>
    <div class="repos-line" data-anim></div>
    <div class="list-col"><span>#</span><span></span><span>项目</span><span></span><span>语言</span><span>Stars</span><span>Forks</span></div>
    ${rows}
  </div>`;
}

/* STATE */
let DATA=null,CUR='daily';
const COLORS={daily:'#ff453a',weekly:'#f97316',monthly:'#0a84ff'};
const NAMES={daily:'今日热门',weekly:'本周飙升',monthly:'本月霸榜'};

function render(t){
  if(!DATA)return;
  const repos=DATA[t]||[];
  const all=[...DATA.daily||[],...DATA.weekly||[],...DATA.monthly||[]];
  renderFeatured(repos);
  renderMetrics(repos,all);
  document.getElementById('repoSection').innerHTML=renderRepos(NAMES[t],repos,COLORS[t]);
  requestAnimationFrame(()=>{initAnim();animNums();renderCharts(repos,all);});
}

document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.nav-tab');if(!t)return;
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');CUR=t.dataset.t;render(CUR);
});

(async()=>{
  initAnim();
  try{
    let ok=false;
    try{const r=await fetch('data.json');if(r.ok){DATA=await r.json();ok=true;}}catch(e){}
    if(!ok){document.getElementById('featured').innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);font-size:14px">请通过 HTTP 服务器打开</div>';return;}
    document.getElementById('clock').textContent=DATA.updated_date||'';
    render(CUR);
  }catch(e){console.error('GitPulse:',e);}
})();
</script>
